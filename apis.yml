description: Novoprotein (Suzhou Novoprotein Scientific / 苏州近岸蛋白质科技股份有限公司) is a Chinese
  biotechnology company specializing in recombinant protein preparation and related
  life-science reagents and contract research services. Its catalog spans mRNA vaccine
  raw materials, cytokines and growth factors, Matrigel and culture media, reference
  and bispecific antibodies, cell lines, target proteins, and viral research products
  serving drug discovery, cell therapy, and diagnostics customers. It was surfaced
  as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network. As a B2B reagent supplier it publishes no public developer API, API
  documentation, or developer portal.
